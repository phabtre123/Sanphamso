<!DOCTYPE html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thám tử thư mục • Học qua khám phá</title><style>
:root{--ink:#173b42;--green:#16766a;--lime:#e0f29c;--paper:#f6f7ef;--line:#dce4da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);padding:11px 19px;border-radius:12px;font-weight:650}button:hover{border-color:var(--green);background:#eff7ef}button:focus-visible,a:focus-visible{outline:3px solid #e8ad36;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#105b52}.wrap{max-width:1180px;margin:auto;padding:0 28px}header{display:flex;align-items:center;justify-content:space-between;padding:24px 0;border-bottom:1px solid var(--line);gap:15px}.brand{font-size:22px;font-weight:850}.brand span{display:inline-grid;place-items:center;background:var(--green);color:white;width:44px;height:44px;border-radius:14px;margin-right:10px}nav{display:flex;gap:8px;flex-wrap:wrap}.tag{font-size:12px;letter-spacing:2px;font-weight:800;text-transform:uppercase;color:var(--green)}h1{font-size:clamp(38px,5.7vw,68px);line-height:1.12;letter-spacing:-2px;margin:20px 0}h2{font-size:28px;line-height:1.25}p{color:#526769}.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:50px;align-items:center;padding:55px 0 35px}.hero p{max-width:550px;font-size:19px}.art{background:#e2ebdb;min-height:355px;border-radius:36px;position:relative;display:grid;place-items:center;overflow:hidden}.art:before,.art:after{content:'';position:absolute;border:1px solid #b9cfb6;border-radius:50%;width:380px;height:380px}.art:after{width:260px;height:260px}.folder-art{z-index:1;transform:rotate(-9deg);background:#f6c857;width:220px;height:150px;border-radius:14px;box-shadow:15px 20px 0 #c0d0b3;position:relative;display:grid;place-items:center;font-size:82px}.folder-art:before{content:'';position:absolute;width:90px;height:28px;background:#f6c857;top:-20px;left:0;border-radius:12px 12px 0 0}.badge{position:absolute;bottom:28px;right:25px;background:white;padding:10px 17px;border-radius:12px;z-index:2;font-size:14px;box-shadow:0 5px 20px #173b4210}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0 45px}.card,.panel{border:1px solid var(--line);background:white;border-radius:20px;padding:26px}.card small{color:var(--green);font-weight:800}.card h3{margin:12px 0 7px}.card p{font-size:15px;margin:0}footer{border-top:1px solid var(--line);font-size:13px;color:#647574;padding:22px 0;margin-top:32px}.hidden{display:none!important}.gamehead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:28px 0 18px}.progress{display:flex;gap:9px}.dot{width:40px;height:7px;border-radius:10px;background:#d7e1d5}.dot.on{background:var(--green)}.playgrid{display:grid;grid-template-columns:300px 1fr;gap:22px}.brief{background:#e5eedb;border:0}.brief h2{font-size:25px}.label{font-size:13px;text-transform:uppercase;letter-spacing:1px;font-weight:800}.clue{background:#fff9e6;border:1px solid #efdfab;padding:15px;border-radius:12px;font-size:15px}.browser{padding:0;overflow:hidden;min-height:430px}.bar{background:#f0f4ed;padding:15px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-size:14px}.files{padding:24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.file{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:135px;text-align:center;overflow-wrap:anywhere;font-size:15px;font-weight:600}.file.selected{background:#edf5d8;border:2px solid var(--green)}.ico{font-size:43px;line-height:1}.tools{padding:0 24px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tools input{width:100%;max-width:330px;padding:10px;border:1px solid #aabdb2;border-radius:9px}.feedback{margin-top:18px;padding:18px;border-radius:14px;background:#fff4d5}.feedback.good{background:#e2f1d7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.results{max-width:850px;margin:40px auto}.score{font-size:64px;color:var(--green);font-weight:850}table{border-collapse:collapse;width:100%;font-size:15px}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.doc{max-width:900px;margin:35px auto}.doc h3{margin-top:28px}.doc li{margin-bottom:8px}.chip{display:inline-block;padding:4px 12px;background:var(--lime);border-radius:30px;font-size:13px;font-weight:750}.intro input{padding:12px;border-radius:10px;border:1px solid #acbdb4;max-width:260px;width:100%}.muted{font-size:14px;color:#60716d}.summary{display:flex;align-items:center;gap:25px}.teacherbox{margin:20px 0;padding:18px;background:#edf3e8;border-radius:14px}a{color:var(--green)}@media(max-width:800px){.hero{grid-template-columns:1fr;gap:20px;padding-top:30px}.art{min-height:230px}.cards{grid-template-columns:1fr}.playgrid{grid-template-columns:1fr}.brief h2{margin:9px 0}.wrap{padding:0 16px}header{align-items:flex-start}.brand{font-size:17px}nav button{font-size:13px;padding:8px}.files{padding:15px;gap:8px}.file{font-size:13px}h1{letter-spacing:-1px}}@media print{header,footer,.actions,nav,.noprint{display:none!important}body{background:white}.doc,.results{margin:0;max-width:none}.panel{border:0}.hidden{display:none!important}}
</style><div class="wrap"><header><div class="brand"><span>⌕</span>Thám tử thư mục</div><nav><button onclick="home()">Trò chơi</button><button onclick="showHistory()">Kết quả trên máy</button></nav></header><main id="app"></main><footer>HỌC QUA KHÁM PHÁ &nbsp; / &nbsp; Mô phỏng an toàn — không truy cập tệp thật. Kết quả chỉ lưu trên trình duyệt này.<br><strong>Nguyễn Anh Pha - GV Tin học</strong></footer></div><script>
const $=s=>document.querySelector(s),app=$('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state,folder='Góc học tập',selected='',feedback='',good=false;const names=['Tìm đúng tệp','Đặt tên dễ nhớ','Sắp xếp đúng chỗ'];const goals=['Mở thư mục phù hợp và tìm bài trình chiếu về trường của An.','Đổi tên tệp để người khác biết nội dung mà chưa cần mở.','Đưa ảnh sân trường vào đúng thư mục theo yêu cầu.'];function readHistory(){try{return JSON.parse(localStorage.getItem('detective-results')||'[]')}catch{return []}}function home(){app.innerHTML=`<section class="hero"><div><div class="tag">3 nhiệm vụ • 9 thử thách</div><h1>Tệp thất lạc.<br>Thám tử vào cuộc!</h1><p>Góc học tập của An đang hơi lộn xộn. Em hãy lần theo manh mối, tìm lại bài trình chiếu và sắp xếp mọi thứ thật gọn gàng.</p><div class="intro"><label for="team" class="label">Tên nhóm hoặc biệt danh</label><div class="actions"><input id="team" maxlength="30" placeholder="Ví dụ: Đội Măng Non" aria-label="Tên nhóm hoặc biệt danh"><button class="primary" onclick="start()">Bắt đầu điều tra →</button></div></div><p class="muted">Mỗi nhiệm vụ chọn 1 thử thách • Nhiệm vụ 3 đổi thử thách mỗi lượt mới</p></div><div class="art" aria-label="Minh họa thư mục và kính lúp"><div class="folder-art">⌕</div><div class="badge">✦ Mỗi thao tác, một khám phá</div></div></section><section class="cards">${names.map((n,i)=>`<div class="card"><small>NHIỆM VỤ 0${i+1}</small><h3>${['📂','✏️','🗂️'][i]} ${n}</h3><p>${['Khám phá thư mục và nhận diện tệp cần tìm.','Chọn một cái tên rõ ràng, gợi đúng nội dung.','Di chuyển hoặc sao chép tệp theo yêu cầu.'][i]}</p></div>`).join('')}</section>`}const bank=[
[{file:'Truong_em.pptx',type:'slide',dir:'Bài trình chiếu',topic:'bài trình chiếu giới thiệu trường em',ext:'.pptx'}, {file:'Vuon_hoa.png',type:'image',dir:'Hình ảnh',topic:'ảnh vườn hoa',ext:'.png'}, {file:'Loi_chuc.docx',type:'doc',dir:'Văn bản',topic:'văn bản lời chúc',ext:'.docx'}],
[{old:'tep_moi_1.pptx',type:'slide',name:'Truong_em',alt:'Trường em',ext:'.pptx',topic:'bài trình chiếu giới thiệu trường em'}, {old:'anh_001.jpg',type:'image',name:'San_truong',alt:'Sân trường',ext:'.jpg',topic:'ảnh sân trường'}, {old:'van_ban_moi.docx',type:'doc',name:'Loi_chuc',alt:'Lời chúc',ext:'.docx',topic:'văn bản lời chúc'}],
[{file:'San_truong.jpg',type:'image',dir:'Hình ảnh',op:'move',topic:'Di chuyển ảnh sân trường vào Hình ảnh; không giữ tệp ở thư mục gốc.'}, {file:'Truong_em.pptx',type:'slide',dir:'Bài trình chiếu',op:'copy',topic:'Sao chép bài trình chiếu vào Bài trình chiếu và giữ nguyên bản gốc.'}, {file:'Loi_chuc.docx',type:'doc',dir:'Văn bản',op:'copy',topic:'Sao chép lời chúc vào Văn bản và giữ nguyên bản gốc.'}]];
function task(){return bank[state.step][state.variants[state.step]]}
let task3Bag=[],lastTask3=-1;
function drawTask3(){
 try{const saved=JSON.parse(localStorage.getItem('detective-task3-draw')||'null');if(saved&&Array.isArray(saved.bag)&&saved.bag.every(v=>Number.isInteger(v)&&v>=0&&v<3)&&new Set(saved.bag).size===saved.bag.length&&Number.isInteger(saved.last)&&saved.last>=0&&saved.last<3){task3Bag=saved.bag;lastTask3=saved.last}}catch{}
 if(!task3Bag.length){task3Bag=[0,1,2];for(let j=2;j>0;j--){const k=Math.floor(Math.random()*(j+1));[task3Bag[j],task3Bag[k]]=[task3Bag[k],task3Bag[j]]}if(task3Bag[0]===lastTask3){[task3Bag[0],task3Bag[1]]=[task3Bag[1],task3Bag[0]]}}
 const picked=task3Bag.shift();lastTask3=picked;try{localStorage.setItem('detective-task3-draw',JSON.stringify({bag:task3Bag,last:picked}))}catch{}return picked;
}
function start(){state={team:$('#team').value.trim()||'Thám tử nhí',step:0,variants:[Math.floor(Math.random()*3),Math.floor(Math.random()*3),drawTask3()],errors:[0,0,0],hints:[0,0,0],done:[false,false,false],started:Date.now()};resetView();render()}
function resetView(){folder='Góc học tập';selected='';feedback='';good=false}
function items(){let t=task();const dirs=[['Hình ảnh','folder'],['Bài trình chiếu','folder'],['Văn bản','folder']];if(state.step===0){if(folder==='Góc học tập')return dirs;return folder==='Bài trình chiếu'?[['Truong_em.pptx','slide'],['Gioi_thieu_ban_than.pptx','slide']]:folder==='Hình ảnh'?[['San_truong.jpg','image'],['Vuon_hoa.png','image']]:[['Loi_chuc.docx','doc'],['Ke_hoach.docx','doc']]}if(state.step===1)return [[state.done[1]?state.newName+t.ext:t.old,t.type]];if(folder==='Góc học tập')return [...(!state.done[2]||t.op==='copy'?[[t.file,t.type]]:[]),...dirs];return folder===t.dir&&state.done[2]?[[t.file,t.type]]:[]}
function render(){let i=state.step,t=task();let description=i===0?'Tìm '+t.topic+'.':i===1?'Đổi tên '+t.topic+' để dễ tìm lại.':t.topic;let clue=i===0?'Tệp cần tìm có phần mở rộng <b>'+t.ext+'</b>. Hãy quan sát tên thư mục và tên tệp.':i===1?'Đặt phần tên là <b>'+t.name+'</b> hoặc <b>'+t.alt+'</b>. Giữ nguyên phần mở rộng '+t.ext+'.':'<b>'+(t.op==='copy'?'Sao chép':'Di chuyển')+'</b> tệp <b>'+t.file+'</b> vào <b>'+t.dir+'</b>. '+(t.op==='copy'?'Bản gốc phải còn ở Góc học tập.':'Tệp không còn ở Góc học tập sau khi chuyển.');
app.innerHTML=`<div class="gamehead"><div><span class="chip">${esc(state.team)}</span> <span class="muted">Nhiệm vụ ${i+1}/3 • Thử thách ${state.variants[i]+1}</span></div><div class="progress">${names.map((_,j)=>`<span class="dot ${j<=i?'on':''}"></span>`).join('')}</div></div><div class="playgrid"><aside class="panel brief"><div class="tag">Hồ sơ 0${i+1}</div><h2>${names[i]}</h2><p>${description}</p><div class="clue"><b>Manh mối</b><br>${clue}</div><div class="actions"><button onclick="hint()" ${state.done[i]?'disabled':''}>💡 Cần gợi ý</button></div><p class="muted">Em được thử lại. Hãy giải thích lựa chọn của mình với bạn cùng nhóm.</p></aside><section><div class="panel browser"><div class="bar"><button aria-label="Về thư mục gốc" onclick="back()" ${folder==='Góc học tập'?'disabled':''}>↑</button><b>Góc học tập ${folder!=='Góc học tập'?' / '+esc(folder):''}</b></div><div class="files">${items().map(([n,k])=>`<button class="file ${selected===n?'selected':''}" onclick="pick('${n}','${k}')"><span class="ico">${({folder:'📁',slide:'📊',image:'🖼️',doc:'📄'})[k]}</span>${esc(n)}</button>`).join('')}${items().length===0?'<p class="muted">Thư mục đang trống.</p>':''}</div><div class="tools">${i===0?`<button class="primary" onclick="checkFind()" ${!selected||state.done[i]?'disabled':''}>Đây là tệp em cần tìm</button>`:i===1?`<label for="rename">Tên mới:</label><input id="rename" maxlength="50" aria-label="Phần tên tệp mới" value="${esc(state.newName||'')}" placeholder="Nhập phần tên, không cần ${t.ext}" ${state.done[i]?'disabled':''}><span>${t.ext}</span><button class="primary" onclick="renameFile()" ${state.done[i]?'disabled':''}>Lưu tên mới</button>`:selected===t.file&&!state.done[i]?`<label for="destination">Thư mục đích:</label><select id="destination"><option value="">Chọn thư mục</option><option>Hình ảnh</option><option>Bài trình chiếu</option><option>Văn bản</option></select><button onclick="organize('move')">Di chuyển</button><button class="primary" onclick="organize('copy')">Sao chép</button>`:`<p class="muted">${state.done[i]?'Mở thư mục đích và trở về gốc để kiểm tra kết quả.':'Chọn tệp, chọn thư mục đích và chọn đúng thao tác.'}</p>`}</div></div><div aria-live="polite">${feedback?`<div class="feedback ${good?'good':''}">${feedback}</div>`:''}</div><div class="actions">${state.done[i]?`<button class="primary" onclick="next()">${i<2?'Nhiệm vụ tiếp theo →':'Xem hồ sơ thành tích →'}</button>`:''}<button onclick="home()">Về trang đầu</button></div></section></div>`}
function back(){folder='Góc học tập';selected='';render()}
function pick(n,t){if(t==='folder'){folder=n;selected=''}else selected=n;render()}
function fail(msg){state.errors[state.step]++;good=false;feedback='🔎 '+msg;render()}
function pass(msg){state.done[state.step]=true;good=true;feedback='✓ '+msg;render()}
function checkFind(){if(state.done[0])return;let t=task();if(selected===t.file&&folder===t.dir)pass('Em đã tìm đúng '+t.file+' trong '+t.dir+'. Tên và vị trí lưu giúp em tìm lại tệp.');else fail('Hãy đối chiếu tên tệp, phần mở rộng '+t.ext+' và nội dung cần tìm, rồi thử lại.')}
function normalizeName(n){return n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().replace(/[ _-]+/g,'')}
function renameFile(){if(state.done[1])return;let t=task(),n=$('#rename').value.trim();state.newName=n;if(normalizeName(n)===normalizeName(t.name))pass('Tên mới gợi đúng nội dung. Phần mở rộng '+t.ext+' được giữ nguyên.');else fail('Trong thử thách này, hãy dùng tên “'+t.name+'” hoặc “'+t.alt+'”. Chỉ nhập phần tên, không nhập '+t.ext+'.')}
function organize(op){if(state.done[2])return;let t=task(),d=$('#destination').value;if(!d){good=false;feedback='Hãy chọn thư mục đích trước.';render();return}if(op!==t.op){fail(t.op==='copy'?'Đề bài yêu cầu giữ bản gốc, nên em cần Sao chép. Di chuyển sẽ đưa tệp ra khỏi vị trí ban đầu.':'Đề bài yêu cầu không giữ tệp ở vị trí ban đầu, nên em cần Di chuyển. Sao chép sẽ giữ bản gốc.');return}if(d!==t.dir){fail('Hãy chọn thư mục '+t.dir+' theo yêu cầu.');return}folder=t.dir;selected='';pass(op==='copy'?'Đã tạo bản sao trong '+t.dir+'. Bản gốc vẫn còn ở Góc học tập. Em có thể trở về để kiểm tra.':'Đã chuyển tệp vào '+t.dir+'. Tệp không còn ở Góc học tập. Em có thể trở về để kiểm tra.')}
function hint(){if(state.done[state.step])return;state.hints[state.step]++;let t=task();good=false;feedback=state.step===0?'💡 Mở '+t.dir+', rồi chọn '+t.file+'.':state.step===1?'💡 Nhập phần tên '+t.name+', rồi bấm Lưu tên mới.':'💡 Chọn '+t.file+', chọn '+t.dir+', rồi bấm '+(t.op==='copy'?'Sao chép':'Di chuyển')+'.';render()}
function next(){if(state.step<2){state.step++;resetView();render()}else finish()}function rating(e,h){return e===0&&h===0?'Tự thực hiện':e<=1&&h<=1?'Hoàn thành sau điều chỉnh':'Hoàn thành có hỗ trợ'}function finish(){state.seconds=Math.round((Date.now()-state.started)/1000);state.date=new Date().toLocaleString('vi-VN');let h=readHistory();h.unshift({...state});try{localStorage.setItem('detective-results',JSON.stringify(h.slice(0,50)))}catch{}showResult(state)}function rows(s){return names.map((n,i)=>`<tr><td>${n}${s.variants?" • Thử thách "+(s.variants[i]+1):""}</td><td>${s.errors[i]}</td><td>${s.hints[i]}</td><td>${rating(s.errors[i],s.hints[i])}</td></tr>`).join('')}function showResult(s){app.innerHTML=`<section class="results panel"><div class="tag">Hồ sơ đã hoàn tất</div><div class="summary"><div class="score">3/3</div><div><h2>Giỏi lắm, ${esc(s.team)}!</h2><p>Em đã tìm, đổi tên và sắp xếp tệp thành công.</p></div></div><table><thead><tr><th>Kĩ năng</th><th>Lần thử sai</th><th>Lần gợi ý</th><th>Ghi nhận</th></tr></thead><tbody>${rows(s)}</tbody></table><p class="muted">${esc(s.date)} • Thời gian khoảng ${Math.ceil(s.seconds/60)} phút. Số lần thử và gợi ý dùng để hỗ trợ học tập, không dùng để xếp hạng học sinh.</p><div class="teacherbox"><b>Thử sức trên máy tính thật</b><p>Tạo thư mục Bai_tap ở vị trí được phép. Đặt tên một tệp gợi đúng nội dung, rồi thực hành sao chép hoặc di chuyển theo hướng dẫn. Kiểm tra tệp ở cả nơi gốc và nơi đích.</p><b>Câu hỏi giải thích:</b> Vì sao cách đặt tên và vị trí lưu này giúp em tìm tệp dễ hơn?</div><div class="actions"><button class="primary" onclick="home()">Chơi lượt mới</button><button onclick="window.print()">In kết quả</button><button onclick="exportCsv()">Tải bảng kết quả CSV</button></div></section>`}function exportCsv(){let data=readHistory();const cell=v=>'"'+String(/^[=+@\-]/.test(String(v))?'\''+v:v).replace(/"/g,'""')+'"';const csv='\ufeff'+[['Nhóm','Thời gian','Nhiệm vụ','Lần thử sai','Lần gợi ý','Ghi nhận'],...data.flatMap(s=>names.map((n,i)=>[s.team,s.date,n+(s.variants?' • Thử thách '+(s.variants[i]+1):''),s.errors[i],s.hints[i],rating(s.errors[i],s.hints[i])]))].map(r=>r.map(cell).join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='Ket_qua_tham_tu_thu_muc.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function showHistory(){let h=readHistory();app.innerHTML=`<section class="doc"><div class="tag">Góc quan sát</div><h2>Kết quả trên thiết bị này</h2><p>Chỉ hiển thị các lượt đã hoàn tất trên cùng trình duyệt. Giáo viên có thể thu tệp CSV từ từng máy; ứng dụng không tự tổng hợp cả lớp.</p>${h.length?`<table><tr><th>Nhóm</th><th>Thời điểm</th><th>Thử sai / Gợi ý</th></tr>${h.map(s=>`<tr><td>${esc(s.team)}</td><td>${esc(s.date)}</td><td>${s.errors.reduce((a,b)=>a+b,0)} / ${s.hints.reduce((a,b)=>a+b,0)}</td></tr>`).join('')}</table>`:'<div class="panel">Chưa có lượt chơi hoàn tất.</div>'}<div class="actions"><button onclick="exportCsv()">Tải CSV</button><button onclick="clearHistory()">Xóa kết quả trên máy</button></div></section>`}function clearHistory(){if(confirm('Xóa tất cả kết quả lưu trên trình duyệt này?')){localStorage.removeItem('detective-results');showHistory()}}

home();
</script></html>
